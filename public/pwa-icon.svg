<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#070d18" />
      <stop offset="50%" stopColor="#0b172a" />
      <stop offset="100%" stopColor="#0284c7" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#0ea5e9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" floodColor="#38bdf8" floodOpacity="0.4" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.25" />

  <!-- Dumbbell (Força & Ferro) -->
  <g filter="url(#glow)">
    <!-- Barra central -->
    <rect x="156" y="222" width="200" height="28" rx="14" fill="#ffffff" />
    <!-- Pesos esquerdos -->
    <rect x="132" y="166" width="32" height="140" rx="14" fill="url(#glowGrad)" />
    <rect x="96" y="186" width="28" height="100" rx="12" fill="#ffffff" />
    <!-- Pesos direitos -->
    <rect x="348" y="166" width="32" height="140" rx="14" fill="url(#glowGrad)" />
    <rect x="388" y="186" width="28" height="100" rx="12" fill="#ffffff" />
  </g>

  <!-- Tipografia de Elite AB FITNESS -->
  <text x="256" y="375" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="46" fill="#ffffff" letter-spacing="4">
    AB FITNESS
  </text>
  <text x="256" y="415" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="18" fill="#38bdf8" letter-spacing="6">
    GESTÃO DE TREINOS
  </text>
</svg>
