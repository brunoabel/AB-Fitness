<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#070d18" />
      <stop offset="50%" stopColor="#0b172a" />
      <stop offset="100%" stopColor="#0284c7" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#0ea5e9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" floodColor="#38bdf8" floodOpacity="0.4" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.25" />

  <!-- Dumbbell (Força & Ferro) -->
  <g filter="url(#glow)">
    <!-- Barra central -->
    <rect x="156" y="242" width="200" height="28" rx="14" fill="#ffffff" />
    <!-- Pesos esquerdos -->
    <rect x="132" y="186" width="32" height="140" rx="14" fill="url(#glowGrad)" />
    <rect x="96" y="206" width="28" height="100" rx="12" fill="#ffffff" />
    <!-- Pesos direitos -->
    <rect x="348" y="186" width="32" height="140" rx="14" fill="url(#glowGrad)" />
    <rect x="388" y="206" width="28" height="100" rx="12" fill="#ffffff" />
  </g>

  <!-- Elemento Futebol: Bola estilizada no centro -->
  <g transform="translate(256, 170)">
    <!-- Círculo bola -->
    <circle cx="0" cy="0" r="48" fill="#ffffff" />
    <circle cx="0" cy="0" r="48" fill="none" stroke="#0ea5e9" stroke-width="4" />
    <!-- Pentágono central -->
    <polygon points="0,-18 17,-6 10,15 -10,15 -17,-6" fill="#0f172a" />
    <!-- Linhas dos gomos -->
    <line x1="0" y1="-18" x2="0" y2="-46" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
    <line x1="17" y1="-6" x2="44" y2="-15" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
    <line x1="10" y1="15" x2="27" y2="40" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
    <line x1="-10" y1="15" x2="-27" y2="40" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
    <line x1="-17" y1="-6" x2="-44" y2="-15" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Tipografia de Elite LA WORKOUT -->
  <text x="256" y="390" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="4">
    LA WORKOUT
  </text>
  <text x="256" y="425" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="19" fill="#38bdf8" letter-spacing="6">
    SUB-17 ATLETA
  </text>
</svg>
