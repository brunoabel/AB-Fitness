<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d18" />
      <stop offset="60%" stop-color="#0b172a" />
      <stop offset="100%" stop-color="#0c2340" />
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#38bdf8" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#38bdf8" stroke-width="3" stroke-opacity="0.18" />

  <!-- AB Monogram - scaled to 512px canvas -->
  <g filter="url(#glow)" transform="translate(80, 60) scale(3.6)">
    <!-- A left stroke -->
    <path d="M 20 120 L 55 30 Q 59 22 65 30 L 88 100" stroke="white" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- A crossbar -->
    <path d="M 32 82 L 76 82" stroke="white" stroke-width="6.5" stroke-linecap="round" fill="none"/>
    <!-- B stem -->
    <path d="M 64 28 L 64 122" stroke="white" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- B upper bump -->
    <path d="M 64 28 Q 110 28 110 52 Q 110 75 64 76" stroke="white" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- B lower bump -->
    <path d="M 64 76 Q 116 76 116 100 Q 116 124 64 122" stroke="white" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Underline swoosh -->
    <path d="M 52 125 Q 88 134 110 128" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" fill="none"/>
    <!-- 4-point star at A/B junction -->
    <g transform="translate(88,64)">
      <line x1="0" y1="-12" x2="0" y2="12" stroke="white" stroke-width="3.2" stroke-linecap="round"/>
      <line x1="-12" y1="0" x2="12" y2="0" stroke="white" stroke-width="3.2" stroke-linecap="round"/>
      <line x1="-6.5" y1="-6.5" x2="6.5" y2="6.5" stroke="white" stroke-width="1.9" stroke-linecap="round"/>
      <line x1="6.5" y1="-6.5" x2="-6.5" y2="6.5" stroke="white" stroke-width="1.9" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Brand name subtitle -->
  <text x="256" y="460" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="30" fill="#38bdf8" letter-spacing="8">FITNESS</text>
</svg>
