<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, shrink-to-fit=no" />
    
    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="theme-color" content="#0A0A0B" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f5f6" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AB Fitness" />
    <meta name="application-name" content="AB Fitness" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    
    <script>
      // Prevenir gestos de pinça (pinch-to-zoom) no Safari iOS
      document.addEventListener('gesturestart', function (e) {
        e.preventDefault();
      }, { passive: false });
      document.addEventListener('gesturechange', function (e) {
        e.preventDefault();
      }, { passive: false });
      document.addEventListener('gestureend', function (e) {
        e.preventDefault();
      }, { passive: false });

      // Prevenir duplo-toque para dar zoom no iOS
      var lastTouchEnd = 0;
      document.addEventListener('touchend', function (e) {
        var now = Date.now();
        if (now - lastTouchEnd <= 300) {
          var target = e.target;
          if (target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.isContentEditable)) {
            return;
          }
          e.preventDefault();
        }
        lastTouchEnd = now;
      }, { passive: false });
    </script>
    
    <title>AB Fitness — Gestão & Performance de Treinos</title>
    
    <!-- PWA Manifest & Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/pwa-icon.svg" />
    <link rel="apple-touch-startup-image" href="/pwa-icon.svg" />
    
    <!-- Google Fonts: Barlow Condensed (Display/Números) + Inter (Corpo) + Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;0,900;1,700&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="antialiased selection:bg-zinc-800 selection:text-white dark:selection:bg-zinc-200 dark:selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Registro do Service Worker para suporte PWA e offline
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(() => {});
        });
      }
    </script>
  </body>
</html>
