<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: 'Plus Jakarta Sans'; font-weight: 500 800; src: url('assets/fonts/plus-jakarta-sans-latin.woff2') format('woff2'); }
      @font-face { font-family: 'Inter'; font-weight: 400 700; src: url('assets/fonts/inter-latin.woff2') format('woff2'); }
      :root {
        --app: #000000;
        --surface: #070709;
        --surface-2: #0a1128;
        --surface-3: #0f172a;
        --accent: #1d3557;
        --accent-hover: #2b4a7a;
        --ink: #ffffff;
        --zinc-300: #d4d4d8;
        --zinc-400: #a1a1aa;
        --zinc-500: #71717a;
        --line: rgba(255, 255, 255, 0.08);
        --heat-0: #121c33;
        --heat-1: #2b4a7a;
        --heat-2: #8ea6d6;
        --heat-3: #f4f7ff;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--app); }
      #root { width: 100%; height: 100%; background: var(--app); font-family: 'Inter', sans-serif; color: var(--ink); }
      .clipv { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="21.12" data-fps="60" data-width="1080" data-height="1920">
      <!-- Cenas (lane 1 e 2 onde se sobrepõem nas passagens) -->

      <div id="serie" data-composition-id="serie" data-composition-src="compositions/serie.html" data-start="1.86" data-duration="1.98" data-track-index="2" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:2"></div>

      <video id="c1" class="clip clipv" src="assets/clips/c1-anilha.mp4" muted playsinline data-start="3.84" data-duration="0.48" data-track-index="3" style="z-index:3"></video>
      <video id="c2" class="clip clipv" src="assets/clips/c2-magnesio.mp4" muted playsinline data-start="4.32" data-duration="0.48" data-track-index="3" style="z-index:3"></video>
